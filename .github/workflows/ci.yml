name: CI

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Opt into Node 24 for bundled JavaScript actions ahead of the
  # June 2 2026 Node 20 deprecation on GitHub-hosted runners.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repo guards
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrations must live at repo root, not under apps/core/migrations
        run: |
          if compgen -G "apps/core/migrations/*.sql" > /dev/null; then
            echo "::error::Found .sql files under apps/core/migrations/. Migrations must live at the repo root migrations/ directory because deploy.sh only reads root."
            ls -la apps/core/migrations/
            exit 1
          fi
          echo "OK: no migrations/ under apps/core/"

  build:
    name: Lint + Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: guard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        # `ci`, not `install`: it installs exactly what the lockfile records and
        # refuses to run when the lockfile has drifted from package.json, so a
        # desync fails here instead of being silently repaired on every run.
        # This step used to `rm -f package-lock.json` (npm/cli#4828, linux
        # native bindings missing from a macOS-generated lockfile). The lockfile
        # carries the linux bindings now, and deleting it meant no run ever
        # built the dependency set the repo records.
        run: npm ci --no-audit --no-fund

      - name: Lint (Turbo, informational, does not block)
        run: npm run lint
        continue-on-error: true

      - name: Build (Turbo)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test (Turbo)
        run: npm test

  lockfile:
    name: Lockfile is canonical
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: guard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` cannot catch this class of bug: it installs exactly what the
      # lockfile records, so a lockfile that installs cleanly but does not match
      # what package.json actually resolves to passes it. That is how a react
      # 19.2.8 bump shipped with the hoisted root react-dom left at 19.2.7 and
      # broke the rules-guru suite at collection time.
      #
      # Note this deliberately does NOT use `npm install --package-lock-only`,
      # which produces a different (smaller) tree than a real install and would
      # fail here on a perfectly good lockfile.
      # npm bundled with Node 22 crashes re-resolving this workspace with no
      # lockfile present ("Cannot read properties of null (reading 'edgesOut')",
      # an arborist bug). Pin the major that handles it.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Re-resolve dependencies from scratch
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Lockfile must match a clean resolve
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is not what a clean resolve of package.json produces. Run: rm -rf node_modules apps/*/node_modules packages/*/node_modules package-lock.json && npm install, then commit the result."
            git diff --stat -- package-lock.json
            echo "--- first 200 lines of drift ---"
            git diff -- package-lock.json | head -200
            exit 1
          fi
          echo "OK: lockfile matches a clean resolve"

  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check + <?php tag guard
        # Two checks, because they catch different failure modes:
        #  1. php -l catches genuine syntax errors.
        #  2. The <?php start-tag guard catches base64/no-tag corruption, which
        #     php -l treats as valid literal-text output (this is exactly how the
        #     corrupted grandkid PR #8 word-search-themes.php would have passed a
        #     lint-only check).
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f"; then fail=1; fi
            if [ "$(head -c 5 "$f")" != "<?php" ]; then
              echo "ERROR: $f does not start with <?php (possible corruption)"
              fail=1
            fi
          done < <(find apps/core/app/php-api -name '*.php' -print0)
          exit $fail
